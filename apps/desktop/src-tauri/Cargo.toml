[package]
name = "ai-voice-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ai_voice_desktop"
path = "src/lib.rs"

[[bin]]
name = "ai-voice-studio"
path = "src/main.rs"

[dependencies]
ai-voice-capability = { path = "../../../core/capability" }
ai-voice-config = { path = "../../../core/config" }
ai-voice-contracts = { path = "../../../core/contracts" }
ai-voice-runtime-host = { path = "../../runtime-host" }
ai-voice-telemetry = { path = "../../../core/telemetry" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
png = "=0.18.1"
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[lints]
workspace = true
